name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for npm provenance/trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Wait for release assets
        run: |
          # Wait for GitHub release assets to be available
          # The release.yml workflow needs to finish uploading executables first
          echo "Waiting 60 seconds for release assets..."
          sleep 60

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update package.json version
        working-directory: npm
        run: |
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version

      - name: Publish to npm
        working-directory: npm
        run: npm publish --access public
        # No NODE_AUTH_TOKEN needed - uses OIDC trusted publishing
        # Provenance is automatic with trusted publishing
