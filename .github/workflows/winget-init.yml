name: WinGet Initial Submission

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to submit (e.g., 0.1.0)'
        required: true

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Install komac
        run: |
          curl -sLO https://github.com/russellbanks/Komac/releases/latest/download/komac-2-linux-x64
          chmod +x komac-2-linux-x64
          sudo mv komac-2-linux-x64 /usr/local/bin/komac

      - name: Get installer URL
        id: asset
        run: |
          URL=$(gh api repos/${{ github.repository }}/releases/tags/v${{ github.event.inputs.version }} --jq '.assets[] | select(.name | endswith("windows-x64.exe")) | .browser_download_url')
          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Submit to WinGet
        run: |
          komac new JuanjoFuchs.ccburn \
            --version ${{ github.event.inputs.version }} \
            --urls "${{ steps.asset.outputs.url }}" \
            --submit
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
