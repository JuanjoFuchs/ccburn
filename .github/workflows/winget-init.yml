name: WinGet Initial Submission

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to submit (e.g., 0.1.0)'
        required: true

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Install komac
        run: |
          KOMAC_VERSION=$(curl -s https://api.github.com/repos/russellbanks/Komac/releases/latest | jq -r '.tag_name')
          curl -sLO "https://github.com/russellbanks/Komac/releases/download/${KOMAC_VERSION}/komac-${KOMAC_VERSION#v}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf komac-*.tar.gz
          sudo mv komac /usr/local/bin/
          komac --version

      - name: Get installer URL
        id: asset
        run: |
          URL=$(gh api repos/${{ github.repository }}/releases/tags/v${{ github.event.inputs.version }} --jq '.assets[] | select(.name | endswith("windows-x64.exe")) | .browser_download_url')
          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Submit to WinGet
        run: |
          komac new JuanjoFuchs.ccburn \
            --version ${{ github.event.inputs.version }} \
            --urls "${{ steps.asset.outputs.url }}" \
            --submit
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
