name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.1.5)'
        required: true

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for npm OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"  # Node 24 ships with npm 11.x which supports OIDC
          registry-url: "https://registry.npmjs.org"  # Required for OIDC
          # IMPORTANT: Do NOT set NODE_AUTH_TOKEN - OIDC handles auth automatically

      - name: Verify npm version
        run: |
          echo "npm version: $(npm --version)"
          # OIDC requires npm >= 11.5.1

      - name: Wait for release assets
        run: |
          # Wait for GitHub release assets to be available
          # The release.yml workflow needs to finish uploading executables first
          echo "Waiting 60 seconds for release assets..."
          sleep 60

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
            VERSION="${VERSION#v}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update package.json version
        working-directory: npm
        run: |
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Publish to npm
        working-directory: npm
        run: npm publish --access public --provenance
        # OIDC authentication happens automatically when:
        # 1. id-token: write permission is set
        # 2. registry-url is configured in setup-node
        # 3. npm version >= 11.5.1
        # 4. Trusted publisher is configured on npmjs.com
        # 5. NODE_AUTH_TOKEN is NOT set
